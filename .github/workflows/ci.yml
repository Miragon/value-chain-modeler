name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run build
      - run: npm test

  test-browser:
    runs-on: ubuntu-latest
    needs: [lint, build]
    # Image tag must match the `playwright` / `@playwright/test` version (here and in e2e);
    # Dependabot does not bump job containers.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run build
      - run: npm run test:browser

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, build]
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The specs import web-app and extension sources in Node, which resolve the workspace
      # packages through their built dist.
      - run: npm run build
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  depcruise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run depcruise

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run build
      # The production web app: e2e runs the dev server, so only this build shows what Netlify ships.
      - run: npm run build:webapp
      - run: npm run check:build -w apps/webapp

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run format:check

  pin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: miragon/pin-npm-dependencies@v1

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5

  vscode-smoke:
    uses: ./.github/workflows/vscode-smoke.yml

  # The merge gate. A required check counts a skipped job as passed, so a failed lint that skips e2e
  # would not block a merge; ci-ok always reports and fails unless every job it needs succeeded.
  # A new job belongs in its needs.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - lint
      - test
      - test-browser
      - e2e
      - depcruise
      - build
      - format-check
      - pin-check
      - dependency-review
      - vscode-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that every job succeeded
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          # dependency-review runs on pull requests only (its own if:), so elsewhere its skip is by design.
          SKIPPED_BY_DESIGN: ${{ github.event_name != 'pull_request' && 'dependency-review' || '' }}
        run: |
          results="$(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<< "$NEEDS")"
          if [ -z "$results" ]; then
            echo "::error::ci-ok needs no job"
            exit 1
          fi
          status=0
          while read -r job result; do
            if [ "$result" = success ]; then
              echo "$job: success"
            elif [ "$result" = skipped ] && [[ " $SKIPPED_BY_DESIGN " == *" $job "* ]]; then
              echo "$job: skipped by design"
            else
              echo "::error::$job ended with result $result"
              status=1
            fi
          done <<< "$results"
          exit "$status"
