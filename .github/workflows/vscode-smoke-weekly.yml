name: VS Code smoke (weekly)

# A new VS Code release can break the extension while the repository stands still. Nobody watches
# a scheduled run, so a failure opens a tracking issue, or comments on the open one.
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vscode-smoke:
    uses: ./.github/workflows/vscode-smoke.yml

  # issues: write stays on this job: a called workflow may not ask for more than its caller grants.
  alert:
    needs: vscode-smoke
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: 'VS Code smoke: the weekly run failed'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number="$(gh issue list --state open --limit 1000 --json number,title \
            --jq 'map(select(.title == env.TITLE)) | first | .number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "The weekly VS Code smoke run failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "The weekly VS Code smoke run failed: $RUN_URL. It starts the packaged extension in the newest stable VS Code and in the engines.vscode minimum. Close this issue once the run is green again."
          fi
