name: VS Code smoke

# Starts the packaged extension in a real VS Code (npm run test:vscode) under the runner's xvfb-run,
# on the newest stable release and on the engines.vscode minimum. ci.yml calls it as the job
# vscode-smoke, which ci-ok needs; vscode-smoke-weekly.yml calls it to catch a new VS Code release.
# It runs the test on the runner, not through test:vscode:docker: a runner has no window to keep in
# the background, and the container would build its image, run npm ci a second time and keep VS Code
# out of actions/cache on every run.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The smoke costs a VS Code download and two runs, wasted on a change that cannot reach the VSIX.
  # A path filter on the trigger is no way out: CI has to report this job on every run.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      # The VSIX bundles the extension, its webview and the packages from source (esbuild, with the
      # compiler options of tsconfig.base.json), the lockfile's resolved versions are inlined, and the
      # test opens example/porter.vc.json and runs on the Node setup.
      - id: decide
        name: Decide whether a path the packaged extension depends on changed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          decide() {
            echo "run=$1" >> "$GITHUB_OUTPUT"
            echo "$2"
          }
          is_relevant() {
            case "$1" in
              package-lock.json | package.json | */package.json) ;;
              apps/vscode/* | packages/*) ;;
              tsconfig.base.json | example/porter.vc.json | .github/actions/setup/*) ;;
              .github/workflows/ci.yml | .github/workflows/vscode-smoke.yml | .github/workflows/vscode-smoke-weekly.yml) ;;
              *) return 1 ;;
            esac
          }
          case "$EVENT_NAME" in
            pull_request) base="$PULL_REQUEST_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            merge_group) base="$MERGE_GROUP_BASE_SHA" ;;
            *)
              decide true "A $EVENT_NAME run always runs the smoke."
              exit 0
              ;;
          esac
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            decide true "No base commit to compare with: the smoke runs."
            exit 0
          fi
          # --no-renames lists a moved file under its old path too, and quotePath=false keeps a
          # non-ASCII path unquoted, so both still match a pattern above.
          if ! git fetch --no-tags --depth=1 origin "$base" ||
            ! changed=$(git -c core.quotePath=false diff --no-renames --name-only "$base" HEAD); then
            decide true "Cannot compare with the base $base: the smoke runs."
            exit 0
          fi
          relevant=()
          while IFS= read -r path; do
            if [[ -n "$path" ]] && is_relevant "$path"; then relevant+=("$path"); fi
          done <<< "$changed"
          if [[ ${#relevant[@]} -gt 0 ]]; then
            decide true "${#relevant[@]} relevant path(s) changed since $base, the smoke runs: ${relevant[*]}"
          else
            decide false "No relevant path changed since $base: the smoke is skipped."
          fi

  vscode-smoke:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        vscode: [stable, minimum]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The cache key needs the version before the test resolves it; the test then runs exactly it.
      # The minimum comes from engines.vscode at run time, so raising the floor moves the smoke along.
      - id: vscode
        name: Resolve the VS Code version
        shell: bash
        env:
          CHANNEL: ${{ matrix.vscode }}
        run: |
          version=""
          if [[ "$CHANNEL" == minimum ]]; then
            range=$(node -p "require('./apps/vscode/package.json').engines.vscode")
            if [[ "$range" =~ [0-9]+\.[0-9]+\.[0-9]+ ]]; then version="${BASH_REMATCH[0]}"; fi
          else
            version=$(curl -fsSL https://update.code.visualstudio.com/api/releases/stable | jq -r '.[0]')
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::No VS Code version for $CHANNEL: '$version'"
            exit 1
          fi
          echo "VS Code $CHANNEL: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/miragon-modeler-shell/vscode-test
          key: vscode-${{ runner.os }}-${{ runner.arch }}-${{ steps.vscode.outputs.version }}
      - run: xvfb-run -a npm run test:vscode
        env:
          VSCODE_VERSION: ${{ steps.vscode.outputs.version }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vscode-smoke-${{ matrix.vscode }}
          path: test-results/vscode-smoke/
          retention-days: 7
          if-no-files-found: ignore

  # A skipped smoke ends in a job that succeeds, so the caller sees success, never a skip that
  # ci-ok would have to tell apart from a skip after a failure.
  skipped:
    needs: changes
    if: needs.changes.outputs.run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "::notice title=VS Code smoke skipped::No path the packaged extension depends on changed."
