version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    rebase-strategy: 'disabled'
    labels:
      - 'dependencies'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    # @types/vscode must stay <= engines.vscode (^1.96.0) or `vsce package` fails.
    ignore:
      - dependency-name: '@types/vscode'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      # typescript-eslint caps its typescript peer below 6.1, so TS 7 breaks `npm ci`.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    groups:
      # The shared modeler contract and chrome change what users see and what the release says
      # (a 0.x minor of @miragon/modeler-shell breaks the chrome), so they come in a PR of their
      # own that is never auto-merged (dependabot-automerge.yml) and land as
      # `fix(deps): adopt modeler-shell x.y`, which release-please releases.
      modeler-platform:
        applies-to: version-updates
        patterns:
          - '@miragon/modeler-*'
      npm-dependencies:
        patterns:
          - '*'
        exclude-patterns:
          - '@miragon/modeler-*'
        update-types:
          - 'patch'
          - 'minor'
          - 'major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    rebase-strategy: 'disabled'
    labels:
      - 'dependencies'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'patch'
          - 'minor'
          - 'major'
