# Netlify deployment of the demo webapp (apps/webapp).
# npm-workspaces monorepo: based on package-lock.json, Netlify runs `npm install`
# automatically, then the build command builds the webapp.

[build]
  # Force base to the repo root (overrides any base possibly set in the Netlify UI such as
  # "packages/renderer", otherwise publish resolves wrong). publish is relative to base.
  base = "/"
  # The webapp bundles the @miragon/value-chain-* packages from source via Vite aliases
  # (see vite.config.ts), so it is self-contained -> no prior lib build needed.
  command = "npm run build:webapp"
  publish = "apps/webapp/dist"

[build.environment]
  # Vite 8 requires Node 20.19+ / 22.12+.
  NODE_VERSION = "22"

# Single-page app: the catch-all serves index.html for any path (robust against deep links).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
